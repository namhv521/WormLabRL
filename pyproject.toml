[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wormlab-rl"
version = "1.0.0"
description = "Continual Self-Play RL Solver, Progressive PCGRL Map Generator & Interactive Studio for Hungry Worm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Hoang Van Nam", email = "namhv.nitc@gmail.com" }
]
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.26.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
]

[project.scripts]
worm-train = "train_product:main"
worm-test = "test_product:main"
worm-generate = "generate_map:main"
worm-evolve = "evolve_curriculum:main"
worm-studio = "studio_server:main"

[tool.setuptools]
packages = ["worm_ai"]
py-modules = [
  "worm_physics",
  "train_product",
  "test_product",
  "generate_map",
  "evolve_curriculum",
  "studio_server",
  "build_worm_training_replay",
]
