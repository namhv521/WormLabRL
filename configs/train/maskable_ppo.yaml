# MaskablePPO baseline config (SPEC-02 §3). Starting point, not a tuned optimum.
train_manifest: data/manifests/train-v1.json
validation_manifest: data/manifests/validation-v1.json
total_timesteps: 2000000
n_envs: 8
eval_freq: 50000
device: cpu
net_arch: [256, 256]
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
